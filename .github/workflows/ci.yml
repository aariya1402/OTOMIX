name: OTOMIX CI

on:
  push:
  pull_request:

jobs:
  cvss-gate:
    name: CVSS Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Run CVSS gate unit tests
        run: pnpm vitest run scripts/test/cvss-gate.spec.ts
      - name: Evaluate CVSS gate
        run: npx tsx scripts/cvss-gate.ts reports/snyk.json

  snyk-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NOTE: snyk test sends package metadata to Snyk servers.
      # This is standard for CI dependency scanning.
      - name: Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          npx snyk test --all-projects --json > reports/snyk.json || true
      - name: CVSS gate
        run: npx tsx scripts/cvss-gate.ts reports/snyk.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: reports/snyk.json
          retention-days: 7
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [cvss-gate, snyk-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r build

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: [build, snyk-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy placeholder
        run: echo "Deploy step is a placeholder. cvss-gate must pass before this job runs."

