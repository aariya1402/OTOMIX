name: Fuzz Corpus (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  fuzz:
    name: Container-parser fuzz corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -F @otomix/core build
      - run: pnpm -F @otomix/workers build
      - name: Run fuzz
        run: pnpm vitest run --project fuzz
      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-manifest
          path: |
            fuzz/manifest.json
            fuzz/corpus/
          retention-days: 14