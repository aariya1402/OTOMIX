name: Policy Check (conftest)

on:
  push:
    branches: [P06, main]
  pull_request:
    branches: [P06, main]

jobs:
  conftest:
    name: Secrets policy (OPA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.55.0/conftest_0.55.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin/
          conftest --version
      - name: Allow-list (deploy/secrets/) must pass
        run: conftest test --policy policy/ deploy/
      - name: Deny-list (policy/testdata/) must fail
        run: |
          if conftest test --policy policy/ policy/testdata/; then
            echo "FAIL: plaintext secret was allowed"
            exit 1
          else
            echo "PASS: plaintext secret correctly rejected"
          fi