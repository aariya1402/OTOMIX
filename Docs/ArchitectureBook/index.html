<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTOMIX Architecture Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="menu-toggle" type="button" aria-label="Toggle menu">Menu</button>
    <a id="brand" href="#/">OTOMIX Architecture Book</a>
    <input id="search" type="search" placeholder="Search tasks (press /)" aria-label="Search tasks" autocomplete="off">
    <button id="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
  </header>
  <div id="search-results" hidden></div>
  <div id="layout">
    <aside id="sidebar"><nav id="nav" aria-label="Phases"></nav></aside>
    <main id="main"></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="book-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
