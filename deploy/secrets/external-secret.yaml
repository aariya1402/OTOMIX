# P06-T06-S01-M01: External Secrets Operator (ESO) manifests.
# All OTOMIX secrets come from Vault (KV v2). No plaintext `data:` Secrets
# are permitted in this directory; the OPA policy `policy/secrets.rego`
# enforces this in CI.
#
# Vault path convention (documented in README.md):
#   secret/data/otomix/postgres
#   secret/data/otomix/jwt-signing-keys
#   secret/data/otomix/redis
#   secret/data/otomix/s3

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: otomix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          external-secrets.io/managed-by: "true"
  data:
    - secretKey: username
      remoteRef: { key: secret/data/otomix/postgres, property: username }
    - secretKey: password
      remoteRef: { key: secret/data/otomix/postgres, property: password }
    - secretKey: host
      remoteRef: { key: secret/data/otomix/postgres, property: host }
    - secretKey: port
      remoteRef: { key: secret/data/otomix/postgres, property: port }
    - secretKey: database
      remoteRef: { key: secret/data/otomix/postgres, property: database }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-signing-keys
  namespace: otomix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jwt-signing-keys
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          external-secrets.io/managed-by: "true"
  dataFrom:
    - extract:
        key: secret/data/otomix/jwt-signing-keys
---
