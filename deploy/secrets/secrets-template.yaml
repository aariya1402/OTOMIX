# P06-T06-S01-M01: Reusable template ExternalSecret.
# Add new application config by adding a new key under
# `secret/data/otomix/app-config` in Vault — no YAML changes here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otomix-app-config
  namespace: otomix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: otomix-app-config
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          external-secrets.io/managed-by: "true"
  dataFrom:
    - extract:
        key: secret/data/otomix/app-config