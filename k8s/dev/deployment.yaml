apiVersion: apps/v1
kind: Deployment
metadata:
  name: oto-mix
  namespace: default
  labels:
    app: oto-mix
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oto-mix
  template:
    metadata:
      labels:
        app: oto-mix
        environment: dev
    spec:
      containers:
        - name: oto-mix
          image: gcr.io/PROJECT_ID/oto-mix:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: oto-mix-service
  namespace: default
  labels:
    app: oto-mix
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: oto-mix