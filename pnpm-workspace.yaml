  cpu-features: false
  esbuild: true
  ffmpeg-static: true
  protobufjs: false
  ssh2: false
  dependency-cruiser: true
  '@swc/core': true

onlyBuiltDependencies:
  - esbuild
  - '@bufbuild/buf'
  - dependency-cruiser
  - '@swc/core'
  - ffmpeg-static